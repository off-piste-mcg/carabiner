# One row per bundled binary: name  url  sha256
#
# All three are built by this repo's .github/workflows/build-deps.yml and published as a
# release. Upstream has no macOS binary for gallery-dl at all, no official static ffmpeg,
# and — the reason yt-dlp moved here too — only a --onefile macOS build, which is the
# thing we are deliberately not shipping any more (see below).
#
# ffmpeg is a single static universal binary. gallery-dl and yt-dlp are PyInstaller
# **--onedir** trees: a launcher beside an _internal/ directory of libraries. They are
# --onedir rather than --onefile for two reasons, and reverting would silently undo both:
#   1. A one-file build re-extracts its entire embedded Python to a fresh temp dir on
#      every launch — 4.4s and 8.1s per invocation, against 0.11s and 0.15s here.
#   2. It dlopens those extracted libraries, which we did not sign, so it required
#      com.apple.security.cs.disable-library-validation. --onedir does not.
#
# Pin exact versions — "latest" would make builds unreproducible and let a bad upstream
# release land in a signed, notarized app without anyone noticing. The hash is of the
# .tar.gz, verified before anything is unpacked.
