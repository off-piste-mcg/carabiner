name: Carabiner
options:
  bundleIdPrefix: com.offpiste
  deploymentTarget:
    macOS: "13.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
# Project-wide, so the app and its embedded appex always ship the same version without
# bumping it in two places — Xcode warns (and App Store validation would reject) an
# appex whose CFBundleVersion doesn't match its parent app's.
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  Carabiner:
    type: application
    platform: macOS
    sources:
      # BrandAssets is excluded here because it is added explicitly below as a
      # `type: folder` reference (Resources/BrandAssets/). Without the exclude, this
      # plain entry ALSO sweeps it in as loose files at the Resources root
      # (Resources/bg.jpg, Resources/ABCDiatypeMono-Regular.otf) — duplicated, and in
      # the loose-file case ATSApplicationFontsPath: BrandAssets (below) can't find it.
      - path: Carabiner
        excludes:
          - "BrandAssets"
      # The Tahoe-native app icon (Icon Composer document, hand-authored JSON): black
      # fill + the full white mark as one flat layer. macOS 26 draws its own squircle
      # and glass edge from it — shipping pre-rounded PNGs instead is what put the old
      # icon on Tahoe's gray backplate ring. actool also generates the legacy .icns
      # fallback for macOS ≤ 15 from this same file, which is why there is no
      # AppIcon.appiconset any more. `type: file` keeps xcodegen from exploding the
      # bundle into a group of loose JSON/PNG resources.
      - path: Carabiner/AppIcon.icon
        buildPhase: resources
        type: file
      - path: ../carabiner
        buildPhase: resources
      - path: ../assets
        buildPhase: resources
        type: folder
      # Populated by scripts/fetch-deps.sh, and gitignored — a build without it simply has
      # no Contents/Resources/bin, which GrabRunner.binDirectory() reports as nil so the
      # script falls back to Homebrew. `type: folder` is load-bearing: it makes this a
      # folder reference that copies the directory itself, so the binaries land in
      # Resources/bin/. Listed as a plain group they would be copied loose into Resources/
      # and binDirectory() would never find them.
      - path: .deps/bin
        buildPhase: resources
        type: folder
      # Brand canvas + (locally) the licensed font. `type: folder` copies the
      # directory itself, so these land at Resources/BrandAssets/ — same
      # mechanism as .deps/bin above. The .otf is gitignored (licensed, public
      # repo): a checkout without it still builds, and Brand.mono() falls back.
      - path: Carabiner/BrandAssets
        buildPhase: resources
        type: folder
    dependencies:
      - package: KeyboardShortcuts
      - target: CarabinerSafariExtension
        embed: true
    # Order matters here, and it is not the obvious one. Both scripts run before Xcode's
    # own CodeSign step, but the xattr strip must be LAST — see its comment.
    postBuildScripts:
      # Xcode only auto-signs nested code in Frameworks/, PlugIns/ and XPCServices/.
      # Anything under Resources/ is sealed as data and left unsigned, which notarization
      # rejects outright. So the bundled binaries have to be signed by hand, here, before
      # Xcode seals the bundle around them.
      - name: Sign bundled binaries with Hardened Runtime
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          BIN="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Resources/bin"
          [ -d "$BIN" ] || { echo "note: no bundled binaries (run scripts/fetch-deps.sh)"; exit 0; }

          # Notarization requires a secure timestamp on EVERY signature, and this loop
          # signs ~117 nested Mach-Os. A timestamp is a network round-trip to Apple's TSA
          # per file, so paying it on every dev build is the kind of friction that gets a
          # build script abandoned — Debug keeps --timestamp=none, Release earns the wait.
          # Getting this backwards is invisible until notarytool rejects the whole upload.
          if [ "${CONFIGURATION:-Debug}" = "Release" ]; then
            TIMESTAMP_FLAG="--timestamp"
          else
            TIMESTAMP_FLAG="--timestamp=none"
          fi

          # Walk the whole tree, not just the top level: the Python tools are PyInstaller
          # --onedir trees (a launcher beside an _internal/ of dylibs and .so files), and
          # every Mach-O in there needs the runtime flag or notarization rejects the app.
          # Deepest-first, because signing a launcher seals what it links against — sign a
          # nested library afterwards and you invalidate the launcher you just signed.
          # -type f skips the bin/<name> symlinks: the target gets signed on its own, and
          # codesign on a symlink would sign through it a second time.
          find "$BIN" -type f -print0 \
            | while IFS= read -r -d '' f; do
                file -b "$f" | grep -q "Mach-O" || continue
                printf '%s\t%s\n' "$(printf '%s' "$f" | tr -cd / | wc -c)" "$f"
              done \
            | sort -rn | cut -f2- > "$DERIVED_FILE_DIR/machos.txt"

          while IFS= read -r f; do
            # No --entitlements any more. --onedir means we sign every library the tool
            # loads, so library validation is satisfied by them all carrying OUR team ID.
            # The one-file builds this replaced had to dlopen an unpacked Python framework
            # they'd extracted to /tmp, which we hadn't signed — that, and only that, is
            # what needed com.apple.security.cs.disable-library-validation. See gotcha #20.
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              --options runtime "$TIMESTAMP_FLAG" "$f"
            codesign --verify --strict "$f"
          done < "$DERIVED_FILE_DIR/machos.txt"
          echo "signed $(wc -l < "$DERIVED_FILE_DIR/machos.txt" | tr -d ' ') Mach-O files under Resources/bin"

          # Signing a working tool into a broken one is silent — the build still succeeds
          # and the app only fails at grab time, on a teammate's machine. This is the check
          # that catches it, and it is worth more now than before: dropping the entitlement
          # is exactly the kind of change that would show up here first.
          for b in ffmpeg gallery-dl yt-dlp; do
            [ -e "$BIN/$b" ] || continue
            # Both spellings: ffmpeg wants -version and exits non-zero on --version, the
            # Python tools want --version. Check the exit code, not the output — ffmpeg
            # prints its version banner and *then* fails on an option it dislikes.
            "$BIN/$b" -version >/dev/null 2>&1 || "$BIN/$b" --version >/dev/null 2>&1 \
              || { echo "error: $b does not run after signing" >&2; exit 1; }
          done
      # This repo lives under ~/Documents, which is iCloud-synced, and the file provider
      # stamps com.apple.FinderInfo (plus com.apple.fileprovider.fpfs#P) onto the built
      # bundle. codesign refuses those outright — "resource fork, Finder information, or
      # similar detritus not allowed" — so an in-build signature fails.
      #
      # This must be the LAST post-build script. It used to be the first, which was fine
      # while it was the only one: nothing ran between it and CodeSign. Signing ~90 MB of
      # bundled binaries takes long enough that the file provider re-stamps the bundle root
      # in that window, and the build fails on detritus that had already been stripped once.
      # Keep this immediately before CodeSign; add new scripts above it, never below.
      - name: Strip iCloud xattrs before signing
        basedOnDependencyAnalysis: false
        script: |
          if [ -d "$TARGET_BUILD_DIR/$WRAPPER_NAME" ]; then
            xattr -cr "$TARGET_BUILD_DIR/$WRAPPER_NAME"
          fi
    # Hardened Runtime (below) blocks an app from sending Apple Events unless it says it
    # needs to. Carabiner reads the front browser tab with AppleScript and drives the
    # carousel dialog through System Events, so without this entitlement notarization
    # would ship an app whose whole input path is dead. NSAppleEventsUsageDescription in
    # the Info.plist is the *prompt text*; this is the permission to ask at all.
    entitlements:
      path: Carabiner/Carabiner.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        # NOTE: com.apple.security.cs.disable-library-validation is deliberately absent,
        # from here AND from the bundled binaries. It was needed while those were
        # PyInstaller one-file builds, which unpack a Python framework we hadn't signed
        # and dlopen it. They are --onedir now, so every library they load is an ordinary
        # file signed with our team ID and library validation is satisfied without
        # weakening anything. See gotcha #20 — the reasoning is kept there precisely so
        # nobody re-adds it "to be safe".
    info:
      path: Carabiner/Info.plist
      properties:
        # No LSUIElement: Carabiner is a regular app since 2026-08-21 — Dock tile while
        # running, pinnable, Cmd+Tab. The status item stays; the Dock is in addition.
        # See docs/superpowers/specs/2026-08-21-dock-app-design.md.
        CFBundleName: Carabiner
        CFBundleDisplayName: Carabiner
        NSHumanReadableCopyright: "OFF-PISTE"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAppleEventsUsageDescription: "Carabiner reads your active browser tab's URL so it can grab the media you're viewing."
        # Registers every font in Resources/BrandAssets at launch — this is
        # what makes Font.custom("ABCDiatypeMono-Regular") resolve.
        ATSApplicationFontsPath: BrandAssets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The browser extension's background worker opens carabiner://launch purely to
        # start the app when it finds it isn't already listening on the HTTP port — the
        # real grab request goes over HTTP once the app is up. See App.swift's
        # application(_:open:) and extension/src/worker.js's launchApp().
        CFBundleURLTypes:
          - CFBundleURLName: com.offpiste.carabiner
            CFBundleURLSchemes: [carabiner]
        # Accepting public.url is what makes a link dragged onto the Dock tile arrive in
        # application(_:open:) — document-type acceptance only, NOT a scheme-handler
        # claim, so Carabiner never becomes a default-browser candidate. The allowlist
        # (GrabGate.checkURL, via dockOpenAction) decides what actually starts a grab.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web link
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.url]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offpiste.carabiner
        # No MARKETING_VERSION / CURRENT_PROJECT_VERSION here on purpose: this target
        # inherits the project-level pair above. A copy at this level silently outranks
        # it, which is how the app once read 0.1.2 while its embedded appex read 0.2.0 —
        # the exact mismatch the project-level comment exists to prevent.
        GENERATE_INFOPLIST_FILE: NO
        # Points at AppIcon.icon (the appiconset is gone). Explicit because xcodegen only
        # infers this default while an .appiconset exists in the catalog.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing is NOT deferrable to the distribution phase. macOS refuses to register
        # an ad-hoc/linker-signed bundle for user notifications: requestAuthorization
        # fails with UNErrorDomain 1 (notificationsNotAllowed), no prompt is ever shown,
        # and every banner silently fails. Worse, an unsigned copy anywhere on disk
        # registers a team-less "NOTIFICATION#:com.offpiste.carabiner" record with
        # LaunchServices that poisons the signed one — so one stray unsigned build breaks
        # notifications for the signed app too. The branded banner is the whole reason
        # this app exists, so every build signs.
        # The team comes from your environment so no one's personal Team ID is baked into
        # this public repo. Before `xcodegen generate`, run:
        #   export CARABINER_TEAM_ID=$(security find-certificate -a -c "Apple Development" \
        #     -p | openssl x509 -noout -subject | tr ',/' '\n\n' \
        #     | sed -nE 's/.*OU=([A-Z0-9]{10}).*/\1/p' | head -1)
        # Read the team from the certificate's OU field, NOT the parenthetical in the
        # identity name — that parenthetical is the agent ID and signing fails with it.
        # See app/README.md.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${CARABINER_TEAM_ID}
        # Required for notarization, and enabled now rather than at release time: the
        # Hardened Runtime changes what the app is *allowed to do* at runtime (Apple
        # Events, JIT, library loading), so turning it on only in the release build would
        # mean the first notarized DMG is the first time anyone runs the real thing.
        # Every dev build now exercises the same restrictions the shipped app will.
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Distribution signing. Deliberately NOT in base: Debug must keep signing with
        # Apple Development, because that is what the branded notification depends on
        # (gotcha #11) and it is what every dev build has always used.
        Release:
          # Developer ID needs no provisioning profile — apple-events is a Hardened
          # Runtime entitlement, not a capability — so Manual signing is both sufficient
          # and deterministic. Automatic would want -allowProvisioningUpdates and can
          # silently resolve to a different identity than the one intended.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          # A DIFFERENT team from CARABINER_TEAM_ID. That one comes from the Apple
          # Development certificate, which is a personal team; this one is OFF-PISTE B.V.
          # XcodeGen writes ${VAR} through literally and xcodebuild expands it at BUILD
          # time, so this resolves from scripts/release.sh's environment.
          DEVELOPMENT_TEAM: ${CARABINER_RELEASE_TEAM_ID}
          # The app's own signature needs a secure timestamp too, not just the bundled
          # binaries the signing loop above covers.
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Without this, `xcodebuild build` injects com.apple.security.get-task-allow
          # into the signature — in RELEASE too, because the injection is tied to the
          # build action, not the configuration. Notarization rejects any binary carrying
          # it (gotcha #16), so the first release run died at the preflight gate on an
          # honest -configuration Release build. Apple's own answer is archive +
          # exportArchive, which strips it during export; this setting reaches the same
          # place without the ExportOptions.plist machinery. Our real entitlements still
          # apply — they come from CODE_SIGN_ENTITLEMENTS, which this does not touch.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  CarabinerSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - CarabinerSafariExtension
      # The extension source, populated by extension/build.sh, which allowlist-copies
      # only manifest.json, src/ and icons/ into dist/chrome — node_modules/ and test/
      # are never touched, so there is no exclude pattern to keep in sync as the
      # extension grows. Referenced as three entries rather than one folder reference
      # wrapping dist/chrome itself: a folder reference copies under its OWN name (the
      # same reasoning that puts .deps/bin's contents at Resources/bin/ above), which
      # here would bury manifest.json at Resources/chrome/manifest.json instead of at
      # the resource root Safari requires it at. src/ and icons/ still want to be real
      # folder references, both because manifest.json's own relative paths ("src/...",
      # "icons/...") expect them as literal subdirectories and to keep this from turning
      # into a per-file list that silently goes stale as the extension grows.
      - path: ../extension/dist/chrome/manifest.json
        buildPhase: resources
      - path: ../extension/dist/chrome/src
        buildPhase: resources
        type: folder
      - path: ../extension/dist/chrome/icons
        buildPhase: resources
        type: folder
    # Closes the "edited extension/src/*.js, rebuilt, shipped the old JS" trap — the same
    # shape as the Contents/Resources/carabiner snapshot trap already documented for the
    # main app. This does NOT help a from-scratch checkout: `xcodegen generate` itself
    # resolves the sources above at GENERATE time and fails outright if dist/chrome does
    # not exist yet (confirmed by moving dist/ aside and generating — three "missing
    # source directory" errors), so the very first build after cloning still needs
    # extension/build.sh run once beforehand (release.sh now does this; see its comment).
    # What this DOES fix is every build after that: once dist/chrome exists and the
    # project has been generated once, xcodebuild copies whatever dist/chrome/{src,icons}
    # currently contain at its own Copy Bundle Resources step — folder references are not
    # enumerated into the pbxproj, so neither editing a file's content nor adding a new
    # one under extension/src/ requires a fresh `xcodegen generate`. A pre-build script is
    # the first build phase for this target, strictly before that copy step, so refreshing
    # dist/chrome here means the copy always sees current content. Verified by editing
    # extension/src/worker.js, rebuilding with no manual build.sh run and no regenerate,
    # and diffing the built appex's copy against the edited source.
    preBuildScripts:
      - name: Refresh extension/dist/chrome from extension/src
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "$SRCROOT/../extension/build.sh" >/dev/null
    # Like Carabiner/Info.plist (see app/.gitignore), this is a build product xcodegen
    # writes fresh from `properties` on every `generate` — a hand-authored file at this
    # path is silently overwritten with xcodegen's bare default template (no NSExtension
    # key), which is a real trap: the appex builds and embeds fine, and only fails at
    # Safari's own load step. The NSExtension dict has to live here, not in a checked-in
    # plist file.
    info:
      path: CarabinerSafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Carabiner
        # Xcode's default template hardcodes "1.0"/"1" here, which xcodegen reproduces
        # verbatim — and Xcode then warns at build time that the appex's CFBundleVersion
        # must match its parent app's. Point both at the same project-level values the
        # Carabiner target uses so an app version bump doesn't have to be made twice.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offpiste.carabiner.SafariExtension
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${CARABINER_TEAM_ID}
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        # The appex MUST be sandboxed or pkd refuses to register it and Safari
        # never lists the extension ("plug-ins must be sandboxed" - see the
        # entitlements file's comment). The app stays unsandboxed; only this
        # target carries the entitlement.
        CODE_SIGN_ENTITLEMENTS: CarabinerSafariExtension/CarabinerSafariExtension.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: ${CARABINER_RELEASE_TEAM_ID}
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  CarabinerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CarabinerTests]
    dependencies:
      - target: Carabiner
    settings:
      base:
        # Signing the app target (see above) makes this bundle get signed too, and
        # codesign needs a plist. Nothing here needs a hand-written one — unlike the app,
        # this bundle is never launched, notified, or distributed — so let Xcode generate it.
        GENERATE_INFOPLIST_FILE: YES
        # Must match the host app's signing identity/team. The test bundle is dlopen'd
        # into the Carabiner.app process to run, and Hardened Runtime's library
        # validation refuses to load code signed by a different team (or unsigned) into
        # a hardened process — without this it fails with "different Team IDs" and no
        # test ever runs, even though nothing about the test code itself is wrong.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${CARABINER_TEAM_ID}
